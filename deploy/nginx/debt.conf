# Symmetry Debt behind nginx, served under /debt (the default build).
#
# Include this file INSIDE the `server { … }` block that already serves your domain over HTTPS:
#
#     include /etc/nginx/snippets/symmetry-debt.conf;
#
# For a build at the domain root (NEXT_PUBLIC_BASE_PATH=/), replace the two locations below with
# a single `location / { … }` that has the same contents.

# /debt itself (no trailing slash) and everything under /debt/ — but not /debtors.
location = /debt {
    proxy_pass http://127.0.0.1:3000;
    include /etc/nginx/snippets/symmetry-debt-proxy.conf;
}

location /debt/ {
    # No path after the port: the request path is passed through unchanged. The app is built
    # with the base path "/debt" and expects to see it.
    proxy_pass http://127.0.0.1:3000;
    include /etc/nginx/snippets/symmetry-debt-proxy.conf;
}
