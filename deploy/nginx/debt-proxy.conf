# Shared proxy settings for Symmetry Debt (install as /etc/nginx/snippets/symmetry-debt-proxy.conf).

proxy_http_version 1.1;

# The app builds its links and checks form submissions against the PUBLIC host and scheme.
proxy_set_header Host              $host;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Forwarded-Proto $scheme;
# Appends the address nginx saw to whatever the client sent; with TRUSTED_PROXY_HOPS=1 the app
# only believes this last entry.
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

# Pages are streamed as they render; buffering would hold them back.
proxy_buffering off;

# Receipts: MAX_UPLOAD_MB (10 by default) plus some room for the form around the file.
client_max_body_size 12m;

proxy_read_timeout 60s;
